<!--Se a página estiver um id definido ela precisa receber o id quando for usar o name
no caso colocar o id -->

<div class="shop shop-list-item">
    <div class="shop-image">
        <a href="{% url "store_app_name:store" store.id %}">
            <img src="{{ store.cover.url }}" alt="image-cover-shop">
        </a>
    </div>
    <div class="shop-title-container">
        <a href="{% url "store_app_name:store" store.id %}">
            <h2>{{ store.title }}</h2>
        </a>
    </div>
    <div class="shop-author">
        <span class="shop-author-item">
            <a href=""><i class="fas fa-user icone-author"></i>{{ store.store_name }}</a>
        </span>


        {% comment "abre chave porcentagem uif e a condição fechando a tag com endif" %}{% endcomment %}
        {% if is_shopp_page is not True %}
        <span class="shop-author-item">
            <i class="fas fa-calendar-alt"></i>
            16/10/2021 às 11:21
        </span>
        {% endif %}

        <!--categoria vai para todas as categorias-->
        <!--categoria aneis irá só para aneis-->
        <span class="shop-author-item">
            <a href="#" class="category-category">
                <i class="shop-category ">Category</i>
            </a>
            :
            <a href="/shop/category/acessorios/" class="category-specific">
                <i class="fas fa-layer-group"></i>
                <span>{{store.category_specific.name_specific}}</span>
            </a>
        </span>
    </div>
    <div class="shop-preco">
        <span class="shop-preco-item">
            <a href="{% url "store_app_name:store" store.id %}">R$ {{ store.price }}</a>
        </span>
    </div>
</div>
