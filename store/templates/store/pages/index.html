<!-- Esse name é uma variavel que foi declarada no context e utiliza-se duas 
 chaves para declarar a variavel com name que foi declarado como dicionario-->
<!--Container main header container é o container maior que ocupa toda a tela-->
<!--Container main header é o container menor com uma classe container que é para mexer
em todos que tiverem essa classe também-->

<!--Se todas as partes do site vai usar a mesma head é importante separar ela para evitar repetição-->

<!--Partials é onde ficará as partes parciais como o head -->
<!--Pages é onde ficará as páginas completas -->

<!--Esse include é para incluir o head que foi movido para partials
essa chave com porcentagem executa uma tarefa e duas chaves mostra algo-->

{% include "store/partials/head.html" %}

<body>
    {% include "store/partials/header.html" %}
    {% include "store/partials/search-container.html" %}

    <main class="main-content-container">
        <div class="main-content main-content-list container">
            <div class="shop shop-list-item">
                <div class="shop-image">
                    <img src="https://placehold.co/1280x720.png" alt="image-cover-shop">
                </div>
                <div class="shop-title-container">
                    <h2 class="shop-title"> produto</h2>
                </div>
                <div class="shop-author">
                    <span class="shop-author-item">
                        <a href=""><i class="fas fa-user icone-author"></i>loja tal</a>
                    </span>

                    <span class="shop-author-item">
                        <i class="fas fa-calendar-alt"></i>
                        16/10/2021 às 11:21
                    </span>
                    <!--categoria vai para todas as categorias-->
                    <!--categoria aneis irá só para aneis-->
                    <span class="shop-author-item">
                        <a href="#" class="category-category">
                            <i class="shop-category ">categoria</i>
                        </a>
                        :
                        <a href="/shop/category/acessorios/" class="category-specific">
                            <i class="fas fa-layer-group"></i>
                            <span>anéis</span>
                        </a>
                    </span>
                </div>
                <div class="shop-preco">
                    <span class="shop-preco">
                        <a href="#">R$ 134,90</a>
                    </span>
                </div>
            </div>
    </main>
</body>

</html>
